<!DOCTYPE html>
<html>
<head>
    <title>Student Buzzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #111; padding: 20px; border-radius: 10px; border: 2px solid #00d2ff; max-width: 350px; margin: 0 auto; }
        input, select, button { width: 90%; padding: 15px; margin: 10px 0; border-radius: 8px; font-size: 1.1em; }
        
        #buzzer { 
            background: #444; 
            color: #aaa; 
            height: 250px; 
            width: 250px; 
            border-radius: 50%; 
            border: 8px solid #555; 
            display: none; 
            margin: 40px auto; 
            font-weight: bold; 
            font-size: 2em;
            cursor: not-allowed;
            transition: all 0.2s;
        }
        
        #buzzer.active {
            background: radial-gradient(#00ff00, #006600);
            color: black;
            border-color: white;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }
        
        #buzzer.locked {
            background: radial-gradient(#ff0055, #80002b);
            color: white;
            border-color: white;
            cursor: not-allowed;
        }
        
        #msg { margin-top: 20px; font-weight: bold; font-size: 1.2em; }
        #recon-msg { color: #00d2ff; font-size: 0.9em; margin-bottom: 10px; display:none; }
        #scan-status { font-size: 0.8em; color: #aaa; margin-top: -5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="login-sec" class="card">
        <h2>STUDENT JOIN</h2>
        <input type="text" id="p-name" placeholder="Enter Your Name">
        
        <select id="room-list">
            <option value="">Connecting...</option>
        </select>
        <div id="scan-status">Connecting to Database...</div>

        <button onclick="join()" style="background:#00d2ff; color:black; border:none; font-weight:bold;">JOIN GAME</button>
    </div>

    <div id="game-sec" style="display:none;">
        <div id="recon-msg">⚡ RECONNECTED TO TEAM</div>
        <h3 id="team-notif" style="color:#aaa;">Waiting for Teacher to Shuffle...</h3>
        <button id="buzzer" onclick="buzz()" disabled>WAIT...</button>
        <div id="msg"></div>
    </div>

    <script>
        const config = { apiKey: "AIzaSyBYYe4I-spWUJ6ORpbue_XKT8pqowmQNqo", authDomain: "trivia-game-3fe59.firebaseapp.com", databaseURL: "https://trivia-game-3fe59-default-rtdb.firebaseio.com", projectId: "trivia-game-3fe59", appId: "1:851139559118:web:df59f13dfd9234c1e89a9f" };
        firebase.initializeApp(config);
        const db = firebase.database();

        // --- ROBUST ROOM SCANNER ---
        const statusDiv = document.getElementById('scan-status');
        const drop = document.getElementById('room-list');

        db.ref('rooms').on('value', (snapshot) => {
            drop.innerHTML = '<option value="">-- Select Room --</option>';
            let count = 0;

            if (!snapshot.exists()) {
                statusDiv.innerText = "No rooms found in database.";
                return;
            }

            snapshot.forEach((child) => {
                const val = child.val();
                // Check if room is valid AND active
                if (val && val.metadata && val.metadata.status === 'active') {
                    let o = document.createElement('option');
                    o.value = child.key;
                    o.innerText = child.key;
                    drop.appendChild(o);
                    count++;
                }
            });

            if (count === 0) {
                statusDiv.innerText = "No ACTIVE rooms found. (Is Teacher Board open?)";
                statusDiv.style.color = "orange";
            } else {
                statusDiv.innerText = "Found " + count + " active room(s).";
                statusDiv.style.color = "#00ff00";
            }
        }, (error) => {
            statusDiv.innerText = "Error: " + error.message;
            statusDiv.style.color = "red";
        });

        // --- JOIN / RECONNECT LOGIC ---
        function join() {
            const name = document.getElementById('p-name').value.trim();
            const room = document.getElementById('room-list').value;
            
            if(!name || !room) return alert("Please enter your name and select a room!");

            const rRef = db.ref('rooms/' + room);
            
            // Check for existing player to reconnect
            rRef.child('players').once('value', snapshot => {
                let existingId = null;
                
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const pData = child.val();
                        if (pData && pData.name && pData.name.toLowerCase() === name.toLowerCase()) {
                            existingId = child.key;
                        }
                    });
                }

                if (existingId) {
                    startGame(existingId, rRef, name, true);
                } else {
                    const newId = name.replace(/\s+/g, '_') + "_" + Math.floor(Math.random()*1000);
                    rRef.child('players/' + newId).set({ name: name, team: 0 });
                    rRef.child('players/' + newId).onDisconnect().remove();
                    startGame(newId, rRef, name, false);
                }
            });
        }

        function startGame(id, rRef, name, isReconnected) {
            document.getElementById('login-sec').style.display = 'none';
            document.getElementById('game-sec').style.display = 'block';
            
            if(isReconnected) {
                document.getElementById('recon-msg').style.display = 'block';
            }

            window.myRRef = rRef; 
            window.myName = name;

            // 1. Team Listener
            rRef.child('players/' + id + '/team').on('value', s => { 
                const team = s.val();
                const b = document.getElementById('buzzer');
                if(team > 0) {
                    document.getElementById('team-notif').innerText = "TEAM " + team;
                    document.getElementById('team-notif').style.color = "#00ff00";
                    b.style.display = 'block'; 
                    window.myTeam = team;
                } else {
                    b.style.display = 'none';
                    document.getElementById('team-notif').innerText = "Wait for Teacher to Shuffle...";
                }
            });

            // 2. Game State Listener (Traffic Light)
            rRef.on('value', snap => {
                const data = snap.val();
                if(!data) return;

                const buzzerState = data.buzzerState || 'closed';
                const currentBuzz = data.currentBuzz || null;
                const btn = document.getElementById('buzzer');
                const msg = document.getElementById('msg');

                if (currentBuzz && currentBuzz.user) {
                    btn.disabled = true;
                    btn.className = "locked";
                    btn.innerText = "LOCKED";
                    msg.innerText = (currentBuzz.user === name) ? "YOU BUZZED!" : currentBuzz.user + " buzzed!";
                    msg.style.color = "#ff0055";
                }
                else if (buzzerState === 'closed') {
                    btn.disabled = true;
                    btn.className = "";
                    btn.innerText = "WAIT...";
                    msg.innerText = "Wait for question...";
                    msg.style.color = "#aaa";
                }
                else {
                    btn.disabled = false;
                    btn.className = "active";
                    btn.innerText = "BUZZ!";
                    msg.innerText = "GO!";
                    msg.style.color = "#00ff00";
                }
            });
        }

        function buzz() {
            if (!window.myTeam) return;
            window.myRRef.child('currentBuzz').transaction(c => {
                return c === null ? { user: window.myName, team: window.myTeam } : undefined;
            });
            if (navigator.vibrate) navigator.vibrate(100);
        }
    </script>
</body>
</html>
