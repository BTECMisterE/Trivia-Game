<!DOCTYPE html>
<html>
<head>
    <title>Trivia Play - Join Room</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #111; padding: 20px; border-radius: 10px; border: 2px solid #00d2ff; max-width: 350px; margin: 0 auto; }
        input, select, button { width: 90%; padding: 15px; margin: 10px 0; border-radius: 8px; font-size: 1.1em; }
        #buzzer { background: radial-gradient(#ff0055, #80002b); color: white; height: 200px; width: 200px; border-radius: 50%; border: 5px solid white; display: none; margin: 20px auto; font-weight: bold; box-shadow: 0 0 20px rgba(255,0,85,0.5); }
    </style>
</head>
<body>

    <div id="login-sec" class="card">
        <h2>STUDENT JOIN</h2>
        <input type="text" id="p-name" placeholder="Your Name">
        <select id="room-list"><option>Scanning for Teacher...</option></select>
        <button onclick="join()" style="background:#00d2ff; color:black; border:none; font-weight:bold;">JOIN GAME</button>
    </div>

    <div id="game-sec" style="display:none;">
        <h3 id="team-notif">Waiting for Team Assignment...</h3>
        <button id="buzzer" onclick="buzz()">BUZZ!</button>
        <div id="msg" style="margin-top:10px; color:yellow;"></div>
    </div>

    <script>
        const config = { apiKey: "AIzaSyBYYe4I-spWUJ6ORpbue_XKT8pqowmQNqo", authDomain: "trivia-game-3fe59.firebaseapp.com", databaseURL: "https://trivia-game-3fe59-default-rtdb.firebaseio.com", projectId: "trivia-game-3fe59", appId: "1:851139559118:web:df59f13dfd9234c1e89a9f" };
        firebase.initializeApp(config);
        const db = firebase.database();

        // Populate Room List
        db.ref('rooms').on('value', s => {
            const drop = document.getElementById('room-list');
            drop.innerHTML = '<option value="">-- Select Room --</option>';
            s.forEach(room => {
                if(room.val().metadata && room.val().metadata.status === 'active') {
                    let o = document.createElement('option'); o.value = room.key; o.innerText = room.key; drop.appendChild(o);
                }
            });
        });

        function join() {
            const name = document.getElementById('p-name').value;
            const room = document.getElementById('room-list').value;
            if(!name || !room) return alert("Select your room!");

            document.getElementById('login-sec').style.display = 'none';
            document.getElementById('game-sec').style.display = 'block';
            
            const rRef = db.ref('rooms/' + room);
            const myId = name + "_" + Math.floor(Math.random()*1000);
            
            rRef.child('players/' + myId).set({ name: name, team: 0 });
            rRef.child('players/' + myId).onDisconnect().remove();

            // Listen for Team
            rRef.child('players/' + myId + '/team').on('value', s => {
                const t = s.val();
                if(t > 0) document.getElementById('team-notif').innerText = "TEAM " + t;
            });

            // Listen for Buzzer
            rRef.child('currentBuzz').on('value', s => {
                const b = document.getElementById('buzzer');
                const v = s.val();
                if(v) {
                    b.style.opacity = "0.3";
                    document.getElementById('msg').innerText = v.user + " buzzed!";
                } else {
                    b.style.opacity = "1";
                    document.getElementById('msg').innerText = "GO!";
                }
            });

            window.myRRef = rRef; window.myName = name;
            document.getElementById('buzzer').style.display = 'block';
        }

        function buzz() {
            window.myRRef.child('currentBuzz').transaction(c => {
                return c === null ? { user: window.myName } : undefined;
            });
        }
    </script>
</body>
</html>
