<!DOCTYPE html>
<html>
<head>
    <title>Trivia Play - Student Beeper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; text-align: center; padding: 10px; }
        .card { background: #111; padding: 20px; border-radius: 15px; border: 2px solid #00d2ff; margin-bottom: 20px; }
        
        input, select { width: 90%; padding: 12px; margin: 10px 0; background: #222; color: white; border: 1px solid #444; border-radius: 8px; font-size: 16px; }
        
        #buzzer { 
            width: 200px; height: 200px; background: radial-gradient(#ff0055, #80002b);
            border-radius: 50%; border: 8px solid white; color: white; font-size: 2em;
            font-weight: bold; cursor: pointer; margin: 20px auto; display: none;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }
        #buzzer:active { transform: scale(0.95); background: #80002b; }
        #buzzer:disabled { background: #444; border-color: #666; opacity: 0.5; cursor: not-allowed; }

        .team-tag { font-size: 1.2em; color: #ffd700; margin: 10px 0; font-weight: bold; }
        .status { color: #00d2ff; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="join-sec" class="card">
        <h2>JOIN GAME</h2>
        <input type="text" id="p-name" placeholder="Your Name">
        
        <p>Choose an Active Room:</p>
        <select id="room-list">
            <option value="">-- Scanning for Rooms... --</option>
        </select>
        
        <p>Pick a Team:</p>
        <select id="team-choice">
            <option value="1">Team 1</option>
            <option value="2">Team 2</option>
            <option value="3">Team 3</option>
            <option value="4">Team 4</option>
            <option value="5">Team 5</option>
            <option value="6">Team 6</option>
        </select>
        
        <button onclick="joinGame()" style="background:#00d2ff; padding:15px; width:95%; border-radius:8px; font-weight:bold;">JOIN NOW</button>
    </div>

    <div id="play-sec" style="display:none;">
        <div class="status" id="status-msg">CONNECTED</div>
        <div class="team-tag" id="my-team-display">Team: ?</div>
        <button id="buzzer" onclick="buzz()">BUZZ!</button>
        <p id="msg" style="color:yellow;"></p>
    </div>

    <script>
        const config = { /* Use your same Firebase Config here */ };
        firebase.initializeApp(config);
        const db = firebase.database();
        let rRef, myId;

        // 1. Scan for Active Rooms
        db.ref('rooms').on('value', s => {
            const drop = document.getElementById('room-list');
            const urlRoom = new URLSearchParams(window.location.search).get('room');
            drop.innerHTML = '<option value="">-- Select Active Room --</option>';
            
            s.forEach(child => {
                let opt = document.createElement('option');
                opt.value = child.key;
                opt.innerText = child.key;
                if(child.key === urlRoom) opt.selected = true;
                drop.appendChild(opt);
            });
        });

        function joinGame() {
            const name = document.getElementById('p-name').value;
            const room = document.getElementById('room-list').value;
            const team = document.getElementById('team-choice').value;

            if(!name || !room) return alert("Enter name and select room!");

            rRef = db.ref('rooms/' + room);
            myId = name + "_" + Math.floor(Math.random()*9999);

            // Create Player Record
            rRef.child('players/' + myId).set({ name: name, team: parseInt(team) });
            
            document.getElementById('join-sec').style.display = 'none';
            document.getElementById('play-sec').style.display = 'block';
            document.getElementById('my-team-display').innerText = "Team " + team;

            // Watch for Team Shuffle from Teacher
            rRef.child('players/' + myId + '/team').on('value', s => {
                document.getElementById('my-team-display').innerText = "Team " + s.val();
            });

            // Watch if Buzzer is Locked
            rRef.child('currentBuzz').on('value', s => {
                const b = document.getElementById('buzzer');
                if(s.exists()) {
                    b.disabled = true;
                    document.getElementById('msg').innerText = s.val().user + " buzzed first!";
                } else {
                    b.disabled = false;
                    document.getElementById('msg').innerText = "";
                }
            });

            document.getElementById('buzzer').style.display = 'block';
        }

        function buzz() {
            const name = document.getElementById('p-name').value;
            const teamText = document.getElementById('my-team-display').innerText;
            
            // Atomic transaction to ensure only one buzzer wins
            rRef.child('currentBuzz').transaction(currentData => {
                if (currentData === null) {
                    return { user: name, team: teamText };
                } else {
                    return; // Already buzzed
                }
            });
        }
    </script>
</body>
</html>
