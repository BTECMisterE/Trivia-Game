<!DOCTYPE html>
<html>
<head>
    <title>Student Buzzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #111; padding: 20px; border-radius: 15px; border: 2px solid #00d2ff; max-width: 400px; margin: 0 auto; }
        input, select { width: 90%; padding: 12px; margin: 10px 0; background: #222; color: white; border: 1px solid #444; border-radius: 8px; font-size: 16px; }
        button { cursor: pointer; padding: 15px; width: 95%; border-radius: 8px; font-weight: bold; border: none; font-size: 1.1em; margin-top: 10px; }
        .btn-green { background: #28a745; color: white; }
        .btn-gray { background: #444; color: white; }
        #buzzer { width: 250px; height: 250px; background: radial-gradient(#ff0055, #80002b); border-radius: 50%; border: 8px solid white; color: white; font-size: 3em; font-weight: bold; cursor: pointer; margin: 40px auto; display: none; }
        #buzzer:disabled { background: #444; opacity: 0.5; }
    </style>
</head>
<body>

    <div id="join-sec" class="card">
        <h2>STUDENT LOGIN</h2>
        <input type="text" id="p-name" placeholder="Enter Name">
        <select id="room-list"><option value="">Scanning...</option></select>
        <button onclick="scanRooms()" class="btn-gray">🔄 Refresh List</button>
        <button onclick="joinGame()" class="btn-green">JOIN GAME</button>
    </div>

    <div id="play-sec" style="display:none;">
        <h3><span id="t-display" style="color:#00d2ff;">Assigning Team...</span></h3>
        <button id="buzzer" onclick="buzz()">BUZZ!</button>
        <div id="msg-box" style="color:yellow; font-size:1.2em; margin-top:10px;"></div>
    </div>

    <script>
        const config = { apiKey: "AIzaSyBYYe4I-spWUJ6ORpbue_XKT8pqowmQNqo", authDomain: "trivia-game-3fe59.firebaseapp.com", databaseURL: "https://trivia-game-3fe59-default-rtdb.firebaseio.com", projectId: "trivia-game-3fe59", appId: "1:851139559118:web:df59f13dfd9234c1e89a9f" };
        firebase.initializeApp(config);
        const db = firebase.database();
        let rRef, myId;

        window.onload = scanRooms;

        function scanRooms() {
            const drop = document.getElementById('room-list');
            drop.innerHTML = '<option value="">Scanning...</option>';
            db.ref('rooms').once('value', s => {
                drop.innerHTML = '<option value="">-- Select Room --</option>';
                s.forEach(child => {
                    const d = child.val();
                    if(d.metadata && d.metadata.status === 'active') {
                        let opt = document.createElement('option'); opt.value = child.key; opt.innerText = child.key; drop.appendChild(opt);
                    }
                });
            });
        }

        function joinGame() {
            const name = document.getElementById('p-name').value;
            const room = document.getElementById('room-list').value;
            if(!name || !room) return alert("Enter name and room.");
            
            document.getElementById('join-sec').style.display = 'none';
            document.getElementById('play-sec').style.display = 'block';
            
            rRef = db.ref('rooms/' + room);
            myId = name + "_" + Math.floor(Math.random() * 1000);
            rRef.child('players/' + myId).set({ name: name, team: 0 });
            rRef.child('players/' + myId).onDisconnect().remove();

            rRef.child('players/' + myId + '/team').on('value', s => {
                const t = s.val();
                document.getElementById('t-display').innerText = (t && t > 0) ? "TEAM " + t : "Wait for Shuffle...";
            });

            rRef.child('currentBuzz').on('value', s => {
                const v = s.val();
                const b = document.getElementById('buzzer');
                if(v) {
                    b.disabled = true;
                    document.getElementById('msg-box').innerText = (v.user === name) ? "YOU BUZZED!" : v.user + " buzzed!";
                } else {
                    b.disabled = false;
                    document.getElementById('msg-box').innerText = "GO!";
                }
            });
            document.getElementById('buzzer').style.display = 'block';
        }

        function buzz() {
            const name = document.getElementById('p-name').value;
            rRef.child('currentBuzz').transaction(c => { return (c === null) ? { user: name } : undefined; });
        }
    </script>
</body>
</html>
