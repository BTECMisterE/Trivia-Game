<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lesson Builder</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; }

        .top-bar { background: #222; padding: 20px; border-radius: 10px; border: 1px solid #444; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        input[type="text"] { padding: 10px; border-radius: 5px; border: 1px solid #555; background: #000; color: white; width: 300px; }
        button, .upload-btn { padding: 10px 20px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; font-size: 13.33px; font-family: inherit; }
        .btn-green { background: #28a745; color: white; }
        .upload-btn { background: #00d2ff; color: black; display: inline-block; }
        .upload-btn input { display: none; }

        .grid { display: grid; gap: 10px; grid-template-columns: repeat(6, 1fr); }
        .col-header input { width: 90%; background: #16213e; color: #00d2ff; font-weight: bold; text-align: center; border: 1px solid #00d2ff; padding: 10px; }
        .cell { background: #111; border: 1px dashed #444; padding: 15px; border-radius: 5px; cursor: pointer; height: 60px; display: flex; align-items: center; justify-content: center; }
        .cell:hover { border-color: #ffd700; background: #222; }
        .cell.filled { border-style: solid; border-color: #28a745; }

        #status { margin: 0 0 16px; padding: 10px 14px; border-radius: 8px; display: none; white-space: pre-line; }
        #status.ok   { display: block; background: rgba(40,167,69,0.25); }
        #status.warn { display: block; background: rgba(255,193,7,0.25); }
        #status.err  { display: block; background: rgba(220,53,69,0.3); }

        #editor-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .editor-box { background: #222; padding: 30px; border: 2px solid #00d2ff; border-radius: 10px; width: 500px; max-width: 92vw; text-align: left; }
        textarea { width: 100%; height: 80px; background: #000; color: white; border: 1px solid #555; margin-bottom: 15px; padding: 10px; box-sizing: border-box; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h2>🛠️ Lesson Builder</h2>
            <input type="text" id="lesson-name" placeholder="Enter Lesson Name (e.g., Biology 101)">
            <label class="upload-btn" style="margin:0; color:black;">📂 UPLOAD LESSON FILE
                <input type="file" id="lesson-file" accept=".json,application/json" onchange="loadLessonFile(this)">
            </label>
            <button class="btn-green" onclick="saveLesson()">💾 SAVE TO DATABASE</button>
        </div>
        <div id="status"></div>
        <div id="grid-container" class="grid"></div>
    </div>

    <div id="editor-overlay">
        <div class="editor-box">
            <h3>Edit Tile</h3>
            <label>Question:</label>
            <textarea id="edit-q"></textarea>
            <label>Answer:</label>
            <textarea id="edit-a"></textarea>
            <div style="text-align: right;">
                <button onclick="closeEditor()" style="background: #e94560; color: white; margin-right: 10px;">Cancel</button>
                <button onclick="saveTile()" style="background: #28a745; color: white;">Save Tile</button>
            </div>
        </div>
    </div>

    <script>
        const config = { apiKey: "AIzaSyBYYe4I-spWUJ6ORpbue_XKT8pqowmQNqo", authDomain: "trivia-game-3fe59.firebaseapp.com", databaseURL: "https://trivia-game-3fe59-default-rtdb.firebaseio.com", projectId: "trivia-game-3fe59", appId: "1:851139559118:web:df59f13dfd9234c1e89a9f" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let builderData = { categories: [] };
        let activeCoords = null;
        let uploaded = false;   // true once a file has filled the grid

        function showStatus(cls, msg) {
            const s = document.getElementById('status');
            s.className = cls;
            s.textContent = msg;
        }

        function init() {
            for(let c=0; c<6; c++) {
                let items = [];
                for(let r=0; r<5; r++) items.push({ q: "Question", a: "Answer" });
                builderData.categories.push({ name: "Category " + (c+1), items: items });
            }
            render();
        }

        function render() {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = "";
            grid.style.gridTemplateColumns = 'repeat(' + builderData.categories.length + ', 1fr)';
            builderData.categories.forEach((cat, cIdx) => {
                let d = document.createElement('div');
                d.className = "col-header";
                let inp = document.createElement('input');
                inp.value = cat.name;
                inp.onchange = (e) => { builderData.categories[cIdx].name = e.target.value; };
                d.appendChild(inp);
                grid.appendChild(d);
            });
            for(let r=0; r<5; r++) {
                builderData.categories.forEach((cat, cIdx) => {
                    let c = document.createElement('div');
                    c.className = "cell" + (uploaded ? " filled" : "");
                    c.innerText = "$" + (200*(r+1));
                    c.onclick = () => openEditor(cIdx, r);
                    grid.appendChild(c);
                });
            }
        }

        /* ---------- upload a lesson.json made by the converter ---------- */
        function loadLessonFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function () {
                try {
                    const j = JSON.parse(reader.result);
                    if (!j || !Array.isArray(j.categories) || j.categories.length === 0) {
                        throw new Error("no categories found. Is this a lesson.json from the converter?");
                    }
                    const warnings = [];
                    let filled = 0;
                    const cats = j.categories.map(function (c, i) {
                        const name = String((c && c.name) || ("Category " + (i + 1))).trim();
                        const src = Array.isArray(c && c.items) ? c.items : [];
                        if (src.length !== 5) warnings.push('"' + name + '" has ' + src.length + ' question(s) instead of 5.');
                        const items = [];
                        for (let r = 0; r < 5; r++) {
                            const it = src[r] || {};
                            const q = String(it.q == null ? "" : it.q).trim();
                            const a = String(it.a == null ? "" : it.a).trim();
                            if (q) filled++;
                            items.push({ q: q, a: a });
                        }
                        return { name: name, items: items };
                    });
                    builderData = { categories: cats };
                    uploaded = true;
                    render();
                    let msg = 'Loaded ' + cats.length + ' categories and ' + filled + ' questions from ' + file.name +
                              '.\nReview any tile by clicking it, type a lesson name above, then click SAVE TO DATABASE.';
                    if (cats.length > 6) warnings.push('More than 6 categories will make the board columns narrow.');
                    showStatus(warnings.length ? 'warn' : 'ok',
                        warnings.length ? msg + '\n\nWarnings:\n' + warnings.join('\n') : msg);
                } catch (err) {
                    showStatus('err', "Couldn't read that file: " + err.message);
                }
                input.value = "";   // lets the same file be picked again
            };
            reader.onerror = function () { showStatus('err', "Couldn't open that file."); input.value = ""; };
            reader.readAsText(file);
        }

        function openEditor(c, r) {
            activeCoords = { c, r };
            const item = builderData.categories[c].items[r];
            document.getElementById('edit-q').value = item.q;
            document.getElementById('edit-a').value = item.a;
            document.getElementById('editor-overlay').style.display = 'flex';
        }

        function saveTile() {
            const q = document.getElementById('edit-q').value;
            const a = document.getElementById('edit-a').value;
            builderData.categories[activeCoords.c].items[activeCoords.r] = { q, a };
            closeEditor();
        }

        function closeEditor() {
            document.getElementById('editor-overlay').style.display = 'none';
        }

        function saveLesson() {
            const name = document.getElementById('lesson-name').value.trim();
            if(!name) return alert("Please enter a lesson name first!");
            if(/[.#$\[\]\/]/.test(name)) return alert("Lesson names can't contain  .  #  $  [  ]  or  /");
            db.ref('library/' + name).set(builderData, (error) => {
                if(error) alert("Error saving: " + error.message);
                else alert("SUCCESS! Lesson '" + name + "' saved. Go back to the Teacher Board and select it!");
            });
        }
        init();
    </script>
</body>
</html>
