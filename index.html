<!DOCTYPE html>
<html>
<head>
    <title>Trivia Master - Teacher Board</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; display: flex; margin: 0; height: 100vh; overflow: hidden; }
        
        /* Layout */
        .sidebar { width: 320px; background: #111; border-right: 2px solid #00d2ff; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .main { flex-grow: 1; padding: 20px; overflow-y: auto; text-align: center; }
        
        /* Boxes */
        .box { background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        .qr-box { background: white; color: black; padding: 10px; border-radius: 8px; text-align: center; }
        
        #debug-bar { background: #fff; color: #000; padding: 8px; font-weight: bold; font-size: 12px; border-radius: 4px; margin-bottom: 10px; }
        
        input, select, textarea { width: 90%; padding: 8px; background: #000; color: #fff; border: 1px solid #444; margin: 5px 0; border-radius: 4px; }
        textarea { resize: vertical; min-height: 60px; }
        
        button { cursor: pointer; padding: 10px; font-weight: bold; border: none; border-radius: 5px; width: 100%; margin-top: 5px; }
        .btn-blue { background: #00d2ff; color: black; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #e94560; color: white; }
        .btn-purple { background: #9b59b6; color: white; }
        
        /* Grid */
        .grid { display: grid; gap: 10px; grid-template-columns: repeat(6, 1fr); margin-top: 20px; }
        .cell { background: #16213e; border: 1px solid #333; color: #ffd700; font-size: 1.5em; padding: 20px 0; cursor: pointer; border-radius: 5px; display: flex; align-items: center; justify-content: center; text-align: center; }
        .cell.used { opacity: 0.15; }
        .cat-input { background: #000; color: #00d2ff; border: 1px solid #00d2ff; font-weight: bold; text-align: center; font-size: 1em; }

        /* Builder Specifics */
        .edit-mode-cell { border: 2px dashed #00d2ff; background: #222; opacity: 0.8; }
        .edit-mode-cell:hover { background: #333; opacity: 1; }
        
        /* Theater / Popup */
        #theater { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(26,26,46,0.98); z-index:2000; flex-direction: column; justify-content: center; align-items: center; }
        #buzzer-notif { background: #e94560; padding: 20px; border-radius: 10px; display: none; font-size: 2em; border: 4px solid white; margin-bottom: 20px; text-align: center; }
        .edit-popup { background: #222; padding: 30px; border: 2px solid #00d2ff; border-radius: 10px; width: 500px; text-align: left; }
    </style>
</head>
<body>
    <audio id="bg-music" loop><source src="https://actions.google.com/sounds/v1/alarms/mechanical_clock_ticking.ogg" type="audio/ogg"></audio>

    <div class="sidebar">
        <div class="qr-box">
            <img src="buzzer-qr.png" style="width: 150px; height: 150px; display:block; margin:0 auto;" alt="QR Code" onerror="this.style.display='none'; document.getElementById('qr-err').style.display='block';">
            <div id="qr-err" style="display:none; color:red; font-size:10px;">IMG NOT FOUND</div>
            <div style="font-weight: bold; margin-top: 5px;">SCAN TO JOIN</div>
        </div>

        <div id="debug-bar">LOG: System Ready.</div>

        <div class="box">
            <strong>1. SETUP ROOM</strong>
            <input type="text" id="r-name" value="Class1">
            <select id="t-count"><option value="2">2 Teams</option><option value="3" selected>3 Teams</option><option value="4">4 Teams</option></select>
            <button class="btn-blue" onclick="activateRoom()">ACTIVATE ROOM</button>
        </div>

        <div id="step2-ui" class="box" style="display:none;">
            <strong>2. SELECT LESSON</strong>
            <select id="lib-drop"><option>Loading...</option></select>
            <button class="btn-blue" onclick="handleStartButton()">START / BUILD</button>
        </div>

        <div id="builder-controls" class="box" style="display:none; border: 2px solid #9b59b6;">
            <strong>BUILDER ACTIVE</strong>
            <input type="text" id="new-lesson-name" placeholder="Name this Lesson...">
            <button class="btn-green" onclick="saveToLibrary()">💾 SAVE BOARD</button>
            <button class="btn-red" onclick="cancelBuilder()">❌ CANCEL</button>
        </div>

        <div id="step3-ui" class="box" style="display:none;">
            <strong>3. CONTROLS</strong>
            <button class="btn-green" onclick="shuffleTeams()">SHUFFLE TEAMS</button>
            <button class="btn-red" onclick="resetScores()">RESET SCORES
