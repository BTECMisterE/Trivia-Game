<!DOCTYPE html>
<html>
<head>
    <title>Master Board - Force Start</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; padding: 20px; }
        #debug-bar { background: #fff; color: #000; padding: 10px; margin-bottom: 20px; font-weight: bold; text-align: left; border-left: 10px solid #00d2ff; }
        .setup-box { background: #111; padding: 20px; border: 2px solid #00d2ff; border-radius: 10px; max-width: 400px; margin: 0 auto; }
        input, select, button { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; font-weight: bold; }
        button { cursor: pointer; border: none; }
        .btn-blue { background: #00d2ff; color: #000; }
        #game-area { display: none; margin-top: 30px; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
        .cell { background: #16213e; border: 1px solid #555; padding: 15px; color: #ffd700; cursor: pointer; }
    </style>
</head>
<body>

    <div id="debug-bar">SYSTEM LOG: <span id="log">Waiting for User...</span></div>

    <div id="setup-screen" class="setup-box">
        <h2>TEACHER SETUP</h2>
        <input type="text" id="r-name" value="Class1" placeholder="Room Name">
        <select id="t-count">
            <option value="2">2 Teams</option>
            <option value="3" selected>3 Teams</option>
            <option value="4">4 Teams</option>
        </select>
        <button class="btn-blue" onclick="forceConnect()">ACTIVATE ROOM</button>
        
        <div id="lesson-load" style="display:none; margin-top: 20px; border-top: 1px solid #444; padding-top: 10px;">
            <select id="lib-drop"><option>Loading Lessons...</option></select>
            <button class="btn-blue" onclick="loadBoard()">START GAME BOARD</button>
        </div>
    </div>

    <div id="game-area">
        <div id="score-display" style="display:flex; justify-content: space-around; font-size: 1.5em; margin-bottom: 20px;"></div>
        <div id="board-grid" class="grid"></div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyBYYe4I-spWUJ6ORpbue_XKT8pqowmQNqo",
            authDomain: "trivia-game-3fe59.firebaseapp.com",
            databaseURL: "https://trivia-game-3fe59-default-rtdb.firebaseio.com",
            projectId: "trivia-game-3fe59",
            appId: "1:851139559118:web:df59f13dfd9234c1e89a9f"
        };

        let db, rRef, teamMax;

        function log(m) { document.getElementById('log').innerText = m; }

        function forceConnect() {
            try {
                log("Connecting...");
                if (!firebase.apps.length) firebase.initializeApp(config);
                db = firebase.database();
                
                const room = document.getElementById('r-name').value;
                teamMax = document.getElementById('t-count').value;
                rRef = db.ref('rooms/' + room);
                
                // Set metadata so students see the room
                rRef.child('metadata').set({ status: 'active', time: Date.now() });
                
                log("CONNECTED: " + room + ". Now loading library...");
                document.getElementById('lesson-load').style.display = 'block';
                
                // Scan Library
                db.ref('library').on('value', s => {
                    const d = document.getElementById('lib-drop');
                    d.innerHTML = '<option value="">-- Select Lesson --</option>';
                    s.forEach(c => {
                        let o = document.createElement('option'); o.value = c.key; o.innerText = c.key; d.appendChild(o);
                    });
                });
            } catch (e) {
                alert("CRITICAL ERROR: " + e.message);
                log("ERROR: " + e.message);
            }
        }

        function loadBoard() {
            const name = document.getElementById('lib-drop').value;
            if(!name) return alert("Select a lesson!");
            
            db.ref('library/' + name).once('value', s => {
                const data = s.val();
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('game-area').style.display = 'block';
                
                // Build Scores
                const sDiv = document.getElementById('score-display'); sDiv.innerHTML = "";
                for(let i=1; i<=teamMax; i++) {
                    sDiv.innerHTML += `<div>T${i}: <span id="score-${i}">0</span></div>`;
                    rRef.child('scores/team'+i).on('value', sv => {
                        document.getElementById('score-'+i).innerText = sv.val() || 0;
                    });
                }
                
                // Build Grid
                const grid = document.getElementById('board-grid'); grid.innerHTML = "";
                data.categories.forEach(cat => {
                    let h = document.createElement('div'); h.innerText = cat.name; h.style.color="#00d2ff"; grid.appendChild(h);
                });
                for(let r=0; r<5; r++) {
                    data.categories.forEach(cat => {
                        let c = document.createElement('div'); c.className="cell"; c.innerText = "$" + (200*(r+1));
                        grid.appendChild(c);
                    });
                }
                log("Game Started: " + name);
            });
        }
    </script>
</body>
</html>
