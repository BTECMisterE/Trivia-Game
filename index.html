<!DOCTYPE html>
<html>
<head>
    <title>Trivia Master - Final Sidebar</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; display: flex; margin: 0; height: 100vh; overflow: hidden; }
        
        /* Sidebar Layout */
        .sidebar { width: 320px; background: #111; border-right: 2px solid #00d2ff; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .main { flex-grow: 1; padding: 20px; overflow-y: auto; text-align: center; }
        
        .box { background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        #debug-bar { background: #fff; color: #000; padding: 8px; font-weight: bold; font-size: 12px; border-radius: 4px; margin-bottom: 10px; }
        
        input, select { width: 90%; padding: 8px; background: #000; color: #fff; border: 1px solid #444; margin: 5px 0; }
        button { cursor: pointer; padding: 10px; font-weight: bold; border: none; border-radius: 5px; width: 100%; margin-top: 5px; }
        .btn-blue { background: #00d2ff; color: black; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #e94560; color: white; }
        
        /* Board Grid */
        .grid { display: grid; gap: 10px; grid-template-columns: repeat(6, 1fr); margin-top: 20px; }
        .cell { background: #16213e; border: 1px solid #333; color: #ffd700; font-size: 1.5em; padding: 20px 0; cursor: pointer; border-radius: 5px; }
        .cell.used { opacity: 0.15; }
        
        /* Popups */
        #theater { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: #1a1a2e; z-index:2000; flex-direction: column; justify-content: center; align-items: center; }
        #buzzer-notif { background: #e94560; padding: 20px; border-radius: 10px; display: none; font-size: 2em; border: 4px solid white; margin-bottom: 20px; }
    </style>
</head>
<body>

    <audio id="bg-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>

    <div class="sidebar">
        <div id="debug-bar">LOG: Waiting for activation...</div>

        <div class="box">
            <strong>1. SETUP ROOM</strong>
            <input type="text" id="r-name" value="Class1">
            <select id="t-count">
                <option value="2">2 Teams</option>
                <option value="3" selected>3 Teams</option>
                <option value="4">4 Teams</option>
            </select>
            <button class="btn-blue" onclick="forceConnect()">ACTIVATE ROOM</button>
        </div>

        <div id="step2-ui" class="box" style="display:none;">
            <strong>2. LESSON & START</strong>
            <select id="lib-drop"><option>Loading...</option></select>
            <button class="btn-blue" onclick="loadBoard()">START GAME</button>
        </div>

        <div id="step3-ui" class="box" style="display:none;">
            <strong>3. CONTROLS</strong>
            <button class="btn-green" onclick="shuffleTeams()">SHUFFLE TEAMS</button>
            <button class="btn-red" onclick="resetScores()">RESET SCORES</button>
            <button onclick="toggleMusic()" id="music-btn" style="background:#444; color:white;">🎵 MUSIC: OFF</button>
        </div>
    </div>

    <div class="main">
        <div id="score-display" style="display:flex; justify-content:center; gap:15px; margin-bottom: 20px; font-size: 1.5em;"></div>
        <div id="board-grid" class="grid"></div>
        <div id="welcome" style="margin-top:100px; color:#444;"><h1>Trivia Master Board</h1><p>Activate your room to begin.</p></div>
    </div>

    <div id="theater">
        <div id="buzzer-notif">🔔 <span id="th-user">NAME</span> BUZZED!</div>
        <div id="q-box" style="font-size:2.5em; padding:30px; text-align:center;"></div>
        <button id="rev-btn" onclick="reveal()" class="btn-blue" style="width:200px;">SHOW ANSWER</button>
        <div id="a-box" style="font-size:2em; color:#ffd700; display:none; padding:20px;"></div>
        <div id="score-ctrls" style="display:none;">
            <div id="team-btns" style="display:flex; gap:10px; justify-content:center;"></div>
            <button onclick="closeTheater()" style="margin-top:20px; background:#444; color:white; width:200px;">BACK TO BOARD</button>
        </div>
    </div>

    <script>
        const config = { apiKey: "AIzaSyBYYe4I-spWUJ6ORpbue_XKT8pqowmQNqo", authDomain: "trivia-game-3fe59.firebaseapp.com", databaseURL: "https://trivia-game-3fe59-default-rtdb.firebaseio.com", projectId: "trivia-game-3fe59", appId: "1:851139559118:web:df59f13dfd9234c1e89a9f" };
        let db, rRef, teamMax, musicPlaying = false;
        const audio = document.getElementById('bg-music');

        function log(m) { document.getElementById('debug-bar').innerText = "LOG: " + m; }

        function forceConnect() {
            if (!firebase.apps.length) firebase.initializeApp(config);
            db = firebase.database();
            const room = document.getElementById('r-name').value;
            teamMax = document.getElementById('t-count').value;
            rRef = db.ref('rooms/' + room);
            
            rRef.child('metadata').set({ status: 'active', time: Date.now() });
            rRef.child('metadata').onDisconnect().remove();

            log("Room '" + room + "' Active.");
            document.getElementById('step2-ui').style.display = 'block';
            
            // Populate Library
            db.ref('library').on('value', s => {
                const d = document.getElementById('lib-drop');
                d.innerHTML = '<option value="">-- Select Lesson --</option>';
                s.forEach(c => { let o = document.createElement('option'); o.value = c.key; o.innerText = c.key; d.appendChild(o); });
            });
            setupBuzzerListener();
        }

        function loadBoard() {
            const name = document.getElementById('lib-drop').value;
            if(!name) return alert("Select a lesson!");
            db.ref('library/' + name).once('value', s => {
                const data = s.val();
                document.getElementById('welcome').style.display = 'none';
                document.getElementById('step3-ui').style.display = 'block';
                
                // Build Scores
                const sDiv = document.getElementById('score-display'); sDiv.innerHTML = "";
                for(let i=1; i<=teamMax; i++) {
                    sDiv.innerHTML += `<div style="background:#222; padding:10px; border:1px solid #ffd700; border-radius:5px;">T${i}: <span id="score-${i}" style="color:#ffd700;">0</span></div>`;
                    rRef.child('scores/team'+i).on('value', sv => { document.getElementById('score-'+i).innerText = sv.val() || 0; });
                }
                
                // Build Grid
                const grid = document.getElementById('board-grid'); grid.innerHTML = "";
                data.categories.forEach(cat => {
                    let h = document.createElement('div'); h.innerText = cat.name; h.style.color="#00d2ff"; h.style.fontWeight="bold"; grid.appendChild(h);
                });
                for(let r=0; r<5; r++) {
                    data.categories.forEach(cat => {
                        const item = cat.items[r];
                        let c = document.createElement('div'); c.className="cell"; c.innerText = "$" + (200*(r+1));
                        c.onclick = () => {
                            document.getElementById('q-box').innerText = item.q;
                            document.getElementById('a-box').innerText = item.a;
                            document.getElementById('theater').style.display = 'flex';
                            document.getElementById('a-box').style.display = 'none';
                            document.getElementById('rev-btn').style.display = 'block';
                            document.getElementById('score-ctrls').style.display = 'none';
                            c.classList.add('used');
                        };
                        grid.appendChild(c);
                    });
                }
                log("Game Board Ready.");
            });
        }

        function reveal() {
            document.getElementById('a-box').style.display = 'block';
            document.getElementById('rev-btn').style.display = 'none';
            document.getElementById('score-ctrls').style.display = 'block';
            const area = document.getElementById('team-btns'); area.innerHTML = "";
            for(let i=1; i<=teamMax; i++) {
                area.innerHTML += `<div>T${i} <button onclick="addPoint(${i})" style="background:green; color:white; border-radius:4px; padding:5px;">+200</button></div>`;
            }
        }

        function addPoint(t) {
            const current = parseInt(document.getElementById('score-'+t).innerText);
            rRef.child('scores/team'+t).set(current + 200);
        }

        function setupBuzzerListener() {
            rRef.child('currentBuzz').on('value', s => {
                const v = s.val();
                document.getElementById('buzzer-notif').style.display = v ? 'block' : 'none';
                if(v) document.getElementById('th-user').innerText = v.user;
            });
        }

        function toggleMusic() {
            if(musicPlaying) { audio.pause(); document.getElementById('music-btn').innerText="🎵 MUSIC: OFF"; } 
            else { audio.volume=0.2; audio.play(); document.getElementById('music-btn').innerText="🎶 MUSIC: ON"; }
            musicPlaying = !musicPlaying;
        }

        function closeTheater() { document.getElementById('theater').style.display = 'none'; rRef.child('currentBuzz').set(null); }
        function resetScores() { if(confirm("Reset?")) for(let i=1; i<=teamMax; i++) rRef.child('scores/team'+i).set(0); }
        function shuffleTeams() { /* Same Fisher-Yates shuffle logic */ }
    </script>
</body>
</html>
