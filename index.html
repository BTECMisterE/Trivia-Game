<!DOCTYPE html>
<html>
<head>
    <title>Trivia Master - Diagnostic</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; display: flex; margin: 0; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 340px; background: #111; border-right: 2px solid #00d2ff; padding: 20px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .main { flex-grow: 1; padding: 20px; overflow-y: auto; text-align: center; }
        
        .box { background: #222; padding: 10px; border-radius: 8px; border: 1px solid #444; text-align: left; }
        .qr-box { background: white; color: black; padding: 10px; border-radius: 8px; text-align: center; }
        
        /* System Log for Debugging */
        #sys-log { background: #000; color: #0f0; font-family: monospace; font-size: 10px; height: 80px; overflow-y: scroll; border: 1px solid #555; padding: 5px; margin-bottom: 10px; }
        
        input, select { width: 95%; padding: 8px; background: #000; color: #fff; border: 1px solid #444; margin: 5px 0; }
        select { background: white; color: black; font-weight: bold; border: 2px solid #00d2ff; }
        button { cursor: pointer; padding: 10px; font-weight: bold; border: none; border-radius: 5px; width: 100%; margin-top: 5px; }
        .btn-blue { background: #00d2ff; color: black; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #e94560; color: white; }
        
        .grid { display: grid; gap: 10px; grid-template-columns: repeat(6, 1fr); margin-top: 20px; }
        .cell { background: #16213e; border: 1px solid #333; color: #ffd700; font-size: 1.5em; padding: 20px 0; cursor: pointer; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
        .cell.used { opacity: 0.15; }
        
        #theater { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: #1a1a2e; z-index:2000; flex-direction: column; justify-content: center; align-items: center; }
        #buzzer-ui { background: #e94560; padding: 10px; border-radius: 5px; display: none; text-align: center; font-weight: bold; margin-bottom: 10px; }
        
        #theater-buzzer { 
            display:none; margin-bottom:20px; color:#fff; font-size:1.5em; font-weight:bold; 
            border: 3px solid #e94560; padding: 15px 30px; border-radius: 10px; background: #e94560; 
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>

    <audio id="bg-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>

    <div class="sidebar">
        <div id="sys-log">System initializing...</div>

        <div class="qr-box">
            <img id="qr-img" style="width: 120px; height: 120px;" alt="QR Code">
            <div style="font-weight: bold; font-size:12px;">SCAN TO JOIN</div>
            <input type="text" id="manual-link" value="Loading..." style="font-size:10px; color:black; background:#eee; border:1px solid #ccc;">
            <a id="qr-link" href="#" target="_blank" style="font-size: 11px; color:blue;">Click to Open Student Page</a>
        </div>

        <div id="buzzer-ui">
            🔔 <span id="b-user">---</span><br>
            <button onclick="resetBuzzer()" style="margin-top:5px; background:white; color:black;">RESET BUZZER</button>
        </div>

        <div class="box">
            <strong>1. SETUP</strong>
            <div style="font-size:11px; color:#aaa;">Room Name:</div>
            <input type="text" id="r-name" value="Class1">
            <div style="font-size:11px; color:#aaa;">Teams:</div>
            <select id="t-count">
                <option value="2">2 Teams</option>
                <option value="3" selected>3 Teams</option>
                <option value="4">4 Teams</option>
                <option value="5">5 Teams</option>
            </select>
            <button class="btn-blue" onclick="connectRoom()">ACTIVATE ROOM</button>
        </div>

        <div class="box">
            <strong>2. LESSON</strong>
            <select id="library-dropdown" style="background:#000; color:#fff;"><option>Scanning...</option></select>
            <button class="btn-blue" onclick="loadLesson()">LOAD QUESTIONS</button>
        </div>

        <div class="box">
            <strong>3. CONTROLS</strong>
            <button class="btn-green" onclick="shuffleTeams()">SHUFFLE TEAMS</button>
            <button class="btn-red" onclick="resetScores()">RESET SCORES</button>
            <button onclick="toggleMusic()" id="music-btn" style="background:#444; color:white;">🎵 MUSIC: OFF</button>
        </div>
    </div>

    <div class="main">
        <div id="score-area" style="display:flex; justify-content:center; gap:10px; margin-bottom: 20px;"></div>
        <div id="main-grid" class="grid"></div>
        <div id="welcome" style="margin-top:100px; color:#444;"><h1>Trivia Master Board</h1></div>
    </div>

    <div id="theater">
        <div id="theater-buzzer">
            🔔 <span id="th-user">NAME</span> BUZZED!
            <button onclick="resetBuzzer()" style="margin-left:20px; background:white; color:#e94560; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">RESET</button>
        </div>
        <div id="q-box" style="font-size:2.5em; padding:30px; text-align:center;"></div>
        <button id="rev-btn" onclick="reveal()" class="btn-blue" style="width:200px;">SHOW ANSWER</button>
        <div id="a-box" style="font-size:2em; color:#ffd700; display:none; padding:20px; text-align:center;"></div>
        <div id="score-ctrls" style="display:none; margin-top:20px;">
            <div id="team-btns" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;"></div>
            <br><button onclick="closeTheater()" style="background:#444; color:white; width:200px;">BACK TO BOARD</button>
        </div>
    </div>
