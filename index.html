<!DOCTYPE html>
<html>
<head>
    <title>Trivia Master - Teacher Board</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; display: flex; margin: 0; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 320px; background: #111; border-right: 2px solid #00d2ff; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .main { flex-grow: 1; padding: 20px; overflow-y: auto; text-align: center; }
        
        .box { background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        
        /* QR Box Styles */
        .qr-box { background: white; color: black; padding: 10px; border-radius: 8px; text-align: center; min-height: 160px; display: flex; flex-direction: column; justify-content: center; align-items: center;}
        
        /* Backup Button (Hidden by default) */
        #backup-btn { display: none; background: #00d2ff; color: black; font-weight: bold; padding: 15px; text-decoration: none; border-radius: 5px; margin-top: 10px; }
        
        #debug-bar { background: #fff; color: #000; padding: 8px; font-weight: bold; font-size: 12px; border-radius: 4px; margin-bottom: 10px; }
        input, select { width: 90%; padding: 8px; background: #000; color: #fff; border: 1px solid #444; margin: 5px 0; }
        button { cursor: pointer; padding: 10px; font-weight: bold; border: none; border-radius: 5px; width: 100%; margin-top: 5px; }
        
        .btn-blue { background: #00d2ff; color: black; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #e94560; color: white; }
        
        .grid { display: grid; gap: 10px; grid-template-columns: repeat(6, 1fr); margin-top: 20px; }
        .cell { background: #16213e; border: 1px solid #333; color: #ffd700; font-size: 1.5em; padding: 20px 0; cursor: pointer; border-radius: 5px; }
        .cell.used { opacity: 0.15; }
        
        #theater { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: #1a1a2e; z-index:2000; flex-direction: column; justify-content: center; align-items: center; }
        #buzzer-notif { background: #e94560; padding: 20px; border-radius: 10px; display: none; font-size: 2em; border: 4px solid white; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>
    <audio id="bg-music" loop><source src="https://www.soundjay.com/misc/sounds/clock-ticking-2.mp3" type="audio/mpeg"></audio>

    <div class="sidebar">
        <div class="qr-box">
            <img id="qr-img" style="width: 150px; height: 150px; display:block;" alt="QR Code" 
                 onerror="this.style.display='none'; document.getElementById('backup-btn').style.display='block'; document.getElementById('scan-text').innerText='QR BLOCKED - USE LINK:';">
            
            <div id="scan-text" style="font-weight: bold; margin-top: 5px;">SCAN TO JOIN</div>
            
            <a id="backup-btn" href="#" target="_blank">OPEN STUDENT LINK</a>
            
            <div style="font-size: 11px; margin-top:5px;">
                <a id="qr-link" href="#" target="_blank" style="color:blue; text-decoration: underline;">(Or Click Here)</a>
            </div>
        </div>

        <div id="debug-bar">LOG: Ready.</div>

        <div class="box">
            <strong>1. SETUP ROOM</strong>
            <input type="text" id="r-name" value="Class1">
            <select id="t-count">
                <option value="2">2 Teams</option>
                <option value="3" selected>3 Teams</option>
                <option value="4">4 Teams</option>
            </select>
            <button class="btn-blue" onclick="activateRoom()">ACTIVATE ROOM</button>
        </div>

        <div id="step2-ui" class="box" style="display:none;">
            <strong>2. LESSON & START</strong>
            <select id="lib-drop"><option>Loading Lessons...</option></select>
            <button class="btn-blue" onclick="loadBoard()">START GAME</button>
        </div>

        <div id="step3-ui" class="box" style="display:none;">
            <strong>3. CONTROLS</strong>
            <button class="btn-green" onclick="shuffleTeams()">SHUFFLE TEAMS</button>
            <button class="btn-red" onclick="resetScores()">RESET SCORES</button>
            <button onclick="toggleMusic()" id="music-btn" style="background:#444; color:white;">🎵 MUSIC: OFF</button>
        </div>
    </div>

    <div class="main">
        <div id="score-display" style="display:flex; justify-content:center; gap:15px; margin-bottom: 20px; font-size: 1.5em;"></div>
        <div id="board-grid" class="grid"></div>
        <div id="welcome" style="margin-top:100px; color:#444;"><h1>Trivia Master Board</h1><p>Enter a room name and click Activate.</p></div>
    </div>

    <div id="theater">
        <div id="buzzer-notif">🔔 <span id="th-user">NAME</span> <br><small id="th-team" style="font-size:0.5em;">TEAM ?</small></div>
        <div id="q-box" style="font-size:2.5em; padding:30px; text-align:center;"></div>
        <button id="rev-btn" onclick="reveal()" class="btn-blue" style="width:200px;">SHOW ANSWER</button>
        <div id="a-box" style="font-size:2em; color:#ffd700; display:none; padding:20px;"></div>
        <div id="score-ctrls" style="display:none;">
            <div id="team-btns" style="display:flex; gap:10px; justify-content:center;"></div>
            <button onclick="closeTheater()" style="margin-top:20px; background:#444; color:white; width:200px;">BACK TO BOARD</button>
        </div>
    </div>
