<audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="step3" class="step-layer">
    <div style="margin-bottom: 10px;">
        <button onclick="toggleMusic()" id="music-btn" style="background:#555; color:white;">🎵 Music: ON</button>
        <button class="btn-purple" onclick="showStep(2)">← Adjust Teams</button>
    </div>
    <div id="score-area" style="display:flex; justify-content:center; gap:10px; margin-bottom:20px;"></div>
    <div id="main-grid" class="grid"></div>
</div>

<script>
    // ... Existing Firebase/Connection Code ...

    const music = document.getElementById('bg-music');
    let musicPlaying = false;

    // Triggered when you transition to Step 3
    function showStep(n) {
        document.querySelectorAll('.step-layer').forEach(l => l.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        
        if(n === 3) {
            buildBoard();
            playMusic();
        } else {
            stopMusic();
        }
    }

    function playMusic() {
        music.volume = 0.2; // Keep it low so you can talk over it
        music.play().catch(e => console.log("Audio requires user interaction first."));
        musicPlaying = true;
        document.getElementById('music-btn').innerText = "🎵 Music: ON";
    }

    function toggleMusic() {
        if (musicPlaying) {
            music.pause();
            document.getElementById('music-btn').innerText = "🔇 Music: OFF";
        } else {
            music.play();
            document.getElementById('music-btn').innerText = "🎵 Music: ON";
        }
        musicPlaying = !musicPlaying;
    }

    function stopMusic() {
        music.pause();
        music.currentTime = 0;
        musicPlaying = false;
    }

    // Optional: Lower music when a question is opened
    function launch(q, a, v, cell, idx) {
        music.volume = 0.05; // Drop the volume to a whisper during the question
        // ... rest of your existing launch logic ...
    }

    function closeTheater() {
        music.volume = 0.2; // Bring music back up when returning to the board
        document.getElementById('theater').style.display = 'none';
        resetBuzzer();
    }
</script>
