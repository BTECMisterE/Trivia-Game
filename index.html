<!DOCTYPE html>
<html>
<head>
    <title>Trivia Master - Teacher Board</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; display: flex; margin: 0; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 320px; background: #111; border-right: 2px solid #00d2ff; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .main { flex-grow: 1; padding: 20px; overflow-y: auto; text-align: center; }
        
        .box { background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 10px; }
        
        /* QR AREA */
        .qr-area { background: white; color: black; padding: 10px; border-radius: 8px; text-align: center; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #db-qr-img { width: 150px; height: 150px; display: none; object-fit: contain; border: 1px solid #ccc; }
        #qr-placeholder { color: #888; font-size: 12px; margin-bottom: 10px; }
        
        /* UPLOAD BUTTON (Small & Gray) */
        .btn-upload { background: #444; color: white; font-size: 10px; padding: 5px; width: auto; margin-top: 5px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-upload:hover { background: #666; }

        /* STANDARD INPUTS */
        input[type="text"], select { width: 90%; padding: 10px; background: #000; color: #fff; border: 1px solid #444; margin: 5px 0; border-radius: 4px; }
        
        /* MAIN BUTTONS */
        button.main-btn { cursor: pointer; padding: 12px; font-weight: bold; border: none; border-radius: 5px; width: 100%; margin-top: 5px; }
        .btn-blue { background: #00d2ff; color: black; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #e94560; color: white; }
        
        .grid { display: grid; gap: 10px; grid-template-columns: repeat(6, 1fr); margin-top: 20px; }
        .cell { background: #16213e; border: 1px solid #333; color: #ffd700; font-size: 1.5em; padding: 20px 0; cursor: pointer; border-radius: 5px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .cell.used { opacity: 0.15; }
        
        #theater { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: #1a1a2e; z-index:2000; flex-direction: column; justify-content: center; align-items: center; }
        #buzzer-notif { background: #e94560; padding: 20px; border-radius: 10px; display: none; font-size: 2em; border: 4px solid white; margin-bottom: 20px; }
        #debug-bar { background: #fff; color: black; font-size: 10px; padding: 2px; }
    </style>
</head>
<body>
    <audio id="bg-music" loop><source src="https://actions.google.com/sounds/v1/alarms/mechanical_clock_ticking.ogg" type="audio/ogg"></audio>

    <div class="sidebar">
        <div class="qr-area">
            <img id="db-qr-img" alt="QR Code">
            
            <div id="qr-placeholder">
                No QR Saved yet.<br>Click below to upload.
            </div>

            <input type="file" id="qr-file-input" accept="image/*" style="display:none;" onchange="uploadQR()">
            <button class="btn-upload" onclick="document.getElementById('qr-file-input').click()">☁️ UPLOAD / CHANGE QR</button>
            
            <div style="font-weight: bold; margin-top: 10px; color:black;">SCAN TO JOIN</div>
            <a id="qr-link" href="play.html" target="_blank" style="font-size: 11px; color: blue;">Open Student Link</a>
        </div>

        <div id="debug-bar">System Ready</div>

        <div class="box">
            <strong>1. SETUP ROOM</strong>
            <input type="text" id="r-name" value="Class1">
            <select id="t-count">
                <option value="2">2 Teams</option>
                <option value="3" selected>3 Teams</option>
                <option value="4">4 Teams</option>
            </select>
            <button class="main-btn btn-blue" onclick="activateRoom()">ACTIVATE ROOM</button>
        </div>

        <div id="step2-ui" class="box" style="display:none;">
            <strong>2. SELECT LESSON</strong>
            <select id="lib-drop" onchange="checkBuilder(this)">
                <option value="">Loading...</option>
            </select>
            <button class="main-btn btn-blue" onclick="loadBoard()">START GAME</button>
        </div>

        <div id="step3-ui" class="box" style="display:none;">
            <strong>3. CONTROLS</strong>
            <button class="main-btn btn-green" onclick="shuffleTeams()">SHUFFLE TEAMS</button>
            <button class="main-btn btn-red" onclick="resetScores()">RESET SCORES</button>
            <button onclick="toggleMusic()" id="music-btn" class="main-btn" style="background:#444; color:white;">🎵 MUSIC: OFF</button>
        </div>
    </div>

    <div class="main">
        <div id="score-display" style="display:flex; justify-content:center; gap:15px; margin-bottom: 20px; font-size: 1.5em;"></div>
        <div id="board-grid" class="grid"></div>
        <div id="welcome" style="margin-top:100px; color:#444;"><h1>Trivia Master Board</h1><p>Enter a room name and click Activate.</p></div>
    </div>

    <div id="theater">
