        .btn-yes { background: #28a745; color: white; }
        .btn-no { background: #dc3545; color: white; }
        
        #buzzer-ui { background: #e94560; padding: 15px; position: fixed; top: 10px; left: 25%; width: 50%; border-radius: 10px; display: none; z-index: 1000; border: 2px solid white; }

    </style>
</head>
