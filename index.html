<!DOCTYPE html>
<html>
<head>
    <title>Trivia Master - Final Fix</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #111; padding: 20px; border-radius: 10px; border: 2px solid #00d2ff; margin-bottom: 20px; }
        #status-bar { background: #000; color: #0f0; padding: 10px; margin: 10px 0; border: 1px solid #333; font-family: monospace; }
        .grid { display: grid; gap: 10px; grid-template-columns: repeat(6, 1fr); margin: 20px 0; }
        .cell { background: #16213e; border: 1px solid #333; color: #ffd700; font-size: 1.5em; padding: 20px 0; cursor: pointer; }
        .cell.used { opacity: 0.15; }
        #theater { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: #1a1a2e; z-index:1000; flex-direction: column; justify-content: center; align-items: center; }
        .score-row { display: flex; justify-content: space-between; width: 300px; padding: 10px; border-bottom: 1px solid #333; }
        input { padding: 8px; background: #000; color: #fff; border: 1px solid #444; }
        button { cursor: pointer; padding: 10px; font-weight: bold; border-radius: 5px; border: none; }
    </style>
</head>
<body>

    <div class="box">
        <h3>1. SYSTEM CONNECTION</h3>
        Room: <input type="text" id="r-name" value="Class1">
        Teams: <input type="number" id="t-count" value="3" style="width:50px;">
        <button onclick="doConnect()" style="background:#00d2ff; color:#000;">CONNECT NOW</button>
        <div id="status-bar">System Status: Ready. Please click Connect.</div>
    </div>

    <div id="score-area" style="display:flex; justify-content:center; gap:10px; margin-bottom:20px;"></div>
    <div id="main-grid" class="grid"></div>

    <div id="theater">
        <div id="q-text" style="font-size:2.5em; padding:20px;"></div>
        <button id="ans-btn" onclick="doReveal()" style="background:#00d2ff; padding:15px;">SHOW ANSWER</button>
        <div id="a-text" style="font-size:2em; color:#ffd700; display:none; padding:20px;"></div>
        
        <div id="score-ctrls" style="display:none; background:rgba(255,255,255,0.1); padding:20px; border-radius:10px;">
            <h4>AWARD POINTS</h4>
            <div id="team-list"></div>
            <button onclick="doClose()" style="margin-top:20px; background:#444; color:white;">CLOSE</button>
        </div>
    </div>

    <div id="ed-sec" class="box">
        <div id="ed-grid" style="display:grid; grid-template-columns: repeat(6,1fr); gap:5px;"></div>
        <button onclick="doBuild()" style="background:#28a745; color:white; width:100%; margin-top:15px; padding:15px; font-size:1.2em;">BUILD GAME BOARD</button>
    </div>

    <script>
        var rRef = null;
        var activeVal = 0;
        var teamMax = 3;

        const config = {
            apiKey: "AIzaSyBYYe4I-spWUJ6ORpbue_XKT8pqowmQNqo",
            authDomain: "trivia-game-3fe59.firebaseapp.com",
            databaseURL: "https://trivia-game-3fe59-default-rtdb.firebaseio.com",
            projectId: "trivia-game-3fe59",
            appId: "1:851139559118:web:df59f13dfd9234c1e89a9f"
        };

        function doConnect() {
            document.getElementById('status-bar').innerText = "Connecting...";
            try {
                if (!firebase.apps.length) { firebase.initializeApp(config); }
                var database = firebase.database();
                var room = document.getElementById('r-name').value;
                teamMax = document.getElementById('t-count').value;
                rRef = database.ref('rooms/' + room);
                
                var sArea = document.getElementById('score-area'); 
                sArea.innerHTML = "";
                for(var i=1; i<=teamMax; i++) {
                    var d = document.createElement('div');
                    d.style = "background:#16213e; padding:10px; border:1px solid #ffd700; border-radius:5px; min-width:80px;";
                    d.innerHTML = "Team "+i+"<br><span id='score-"+i+"' style='font-size:1.5em;color:#ffd700;'>0</span>";
                    sArea.appendChild(d);
                    
                    (function(n) {
                        rRef.child('scores/team'+n).on('value', function(s) {
                            document.getElementById('score-'+n).innerText = s.val() || 0;
                        });
                    })(i);
                }
                document.getElementById('status-bar').innerText = "CONNECTED TO: " + room;
                alert("Connected!");
            } catch(e) {
                document.getElementById('status-bar').innerText = "ERROR: " + e.message;
            }
        }

        function doReveal() {
            document.getElementById('a-text').style.display = 'block';
            document.getElementById('ans-btn').style.display = 'none';
            var list = document.getElementById('team-list');
            list.innerHTML = "";
            for(var i=1; i<=teamMax; i++) {
                list.innerHTML += "<div class='score-row'><span>Team "+i+"</span><div>" +
                    "<button onclick='chgScore("+i+","+activeVal+")' style='background:green; color:white;'>+</button> " +
                    "<button onclick='chgScore("+i+",-"+activeVal+")' style='background:red; color:white;'>-</button></div></div>";
            }
            document.getElementById('score-ctrls').style.display = 'block';
        }

        function chgScore(t, a) {
            var cur = parseInt(document.getElementById('score-'+t).innerText);
            rRef.child('scores/team'+t).set(cur + a);
        }

        function doClose() {
            document.getElementById('theater').style.display = 'none';
            document.getElementById('a-text').style.display = 'none';
            document.getElementById('score-ctrls').style.display = 'none';
        }

        function doBuild() {
            var grid = document.getElementById('main-grid');
            grid.innerHTML = "";
            var vals = [200,400,600,800,1000];
            for(var c=1; c<=6; c++) {
                var h = document.createElement('div'); h.innerHTML = "<b>CAT "+c+"</b>"; grid.appendChild(h);
            }
            vals.forEach(function(v) {
                for(var c=1; c<=6; c++) {
                    var q = document.querySelector(".qi[data-c='"+c+"'][data-v='"+v+"']").value;
                    var a = document.querySelector(".ai[data-c='"+c+"'][data-v='"+v+"']").value;
                    var cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = "$" + v;
                    (function(question, answer, value, element) {
                        element.onclick = function() {
                            if(question) {
                                activeVal = value;
                                document.getElementById('q-text').innerText = question;
                                document.getElementById('a-text').innerText = answer;
                                document.getElementById('theater').style.display = 'flex';
                                document.getElementById('ans-btn').style.display = 'block';
                                element.classList.add('used');
                            }
                        };
                    })(q, a, v, cell);
                    grid.appendChild(cell);
                }
            });
            document.getElementById('ed-sec').style.display = 'none';
        }
