<!DOCTYPE html>
<html>
<head>
    <title>Trivia Master - Force Start</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .emergency-start { background: #ff0055; color: white; padding: 30px; font-size: 2em; border: 5px solid white; cursor: pointer; border-radius: 15px; width: 100%; margin-bottom: 20px; font-weight: bold; }
        .box { background: #111; padding: 20px; border: 2px solid #00d2ff; border-radius: 10px; display: none; } /* Hidden until start */
        .grid { display: grid; gap: 10px; grid-template-columns: repeat(6, 1fr); margin-top: 20px; }
        .cell { background: #16213e; border: 1px solid #333; color: #ffd700; font-size: 1.5em; padding: 20px 0; cursor: pointer; }
        #log { background: #222; color: #0f0; padding: 10px; font-family: monospace; text-align: left; height: 100px; overflow-y: auto; border: 1px solid #444; margin-top: 10px; }
    </style>
</head>
<body>

    <button id="start-btn" class="emergency-start" onclick="forceInitialize()">CLICK HERE TO START SYSTEM</button>

    <div id="game-ui" class="box">
        <h3>SYSTEM ONLINE</h3>
        Room: <input type="text" id="r-name" value="Class1" style="padding:10px;">
        Teams: <input type="number" id="t-count" value="3" style="width:50px; padding:10px;">
        <button onclick="connectFirebase()" style="background:#00d2ff; padding:10px;">SYNC ROOM</button>
        
        <div id="score-area" style="display:flex; justify-content:center; gap:10px; margin:20px 0;"></div>
        <div id="main-grid" class="grid"></div>
    </div>

    <div id="log">Log: Click the pink button to activate...</div>

    <script>
        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML = "> " + msg + "<br>" + l.innerHTML;
        }

        // FORCE START - This wakes up the browser
        function forceInitialize() {
            log("Activating System...");
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            // Build the empty categories immediately
            const grid = document.getElementById('main-grid');
            for(let i=1; i<=6; i++) {
                let h = document.createElement('div');
                h.innerHTML = "<b>CAT "+i+"</b>";
                grid.appendChild(h);
            }
            log("UI Activated. Enter room name and click SYNC.");
        }

        function connectFirebase() {
            log("Connecting to Firebase...");
            const config = {
                apiKey: "AIzaSyBYYe4I-spWUJ6ORpbue_XKT8pqowmQNqo",
                authDomain: "trivia-game-3fe59.firebaseapp.com",
                databaseURL: "https://trivia-game-3fe59-default-rtdb.firebaseio.com",
                projectId: "trivia-game-3fe59",
                appId: "1:851139559118:web:df59f13dfd9234c1e89a9f"
            };

            try {
                if (!firebase.apps.length) firebase.initializeApp(config);
                const db = firebase.database();
                const room = document.getElementById('r-name').value;
                const teams = document.getElementById('t-count').value;
                
                const rRef = db.ref('rooms/' + room);
                
                // Build Scoreboard
                const area = document.getElementById('score-area'); area.innerHTML = "";
                for(let i=1; i<=teams; i++) {
                    let d = document.createElement('div');
                    d.style = "background:#16213e; padding:10px; border:1px solid #ffd700; border-radius:5px; min-width:80px;";
                    d.innerHTML = `Team ${i}<br><span id="s-${i}" style="font-size:1.5em;color:#ffd700;">0</span>`;
                    area.appendChild(d);
                    rRef.child('scores/team'+i).on('value', s => { 
                        document.getElementById('s-'+i).innerText = s.val() || 0; 
                    });
                }
                log("CONNECTED TO CLOUD: " + room);
                alert("Cloud Connection Successful!");
            } catch(e) {
                log("CRITICAL ERROR: " + e.message);
            }
        }
    </script>
</body>
</html>
